name: Build & Test (.NET 8 & 10)

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 & .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore SQLiteXM.Tests/SQLiteXM.Tests.csproj

      - name: Build & Run 602 Tests
        run: dotnet test SQLiteXM.Tests/SQLiteXM.Tests.csproj --filter "FullyQualifiedName~Query_ComplexLinq_LargeDataset_PerformsWell" -m:1 --configuration Release --verbosity normal --blame-hang-timeout 10m --logger "console;verbosity=detailed"
